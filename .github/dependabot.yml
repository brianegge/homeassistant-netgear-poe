version: 2
updates:
  # Also the Home Assistant upgrade path: requirements.test.txt pins
  # pytest-homeassistant-custom-component, which pins an exact Home Assistant
  # release, so these PRs are what move the version CI tests against.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
